    <!-- Arrow Stem -->
    <line x1="32" y1="15" x2="32" y2="37" />
    <!-- Arrow Head -->
    <polyline points="22 27 32 37 42 27" />
    <!-- Bottom Tray -->
    <path d="M16 43v3a3 3 0 0 0 3 3h26a3 3 0 0 0 3-3v-3" />
